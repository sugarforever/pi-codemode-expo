name: Publish to npmjs
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - name: Validate release tag and npm channel
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/validate-release.mjs
      - name: Require native peer to be available on npm
        run: npm view expo-quickjs@0.1.0 version --registry=https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: release-package
      - name: Check for an identical existing publication
        id: state
        run: node scripts/check-publish-state.mjs release-package
      - name: Publish verified artifact with provenance
        if: steps.state.outputs.should-publish == 'true'
        env:
          PUBLISH_TAG: ${{ steps.release.outputs.publish-tag }}
          # Optional first-publish fallback. Prefer npm trusted publishing (OIDC).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish release-package/*.tgz --access public --provenance --tag "$PUBLISH_TAG"
