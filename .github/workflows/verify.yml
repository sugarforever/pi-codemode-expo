name: Verify adapter package
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_QUICKJS_RUNNER: ${{ github.workspace }}/.ci/expo-quickjs/build/channel_runner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.ref }}
      - name: Checkout tested native engine revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: sugarforever/expo-quickjs
          ref: 85b5a08d9ecfd088b5c16a6ac00c7eccf5777171
          path: .ci/expo-quickjs
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --legacy-peer-deps
        working-directory: .ci/expo-quickjs
      - name: Build native QuickJS conformance runner
        run: |
          cmake -S .ci/expo-quickjs -B .ci/expo-quickjs/build -DCMAKE_BUILD_TYPE=Release
          cmake --build .ci/expo-quickjs/build --parallel 2
          ctest --test-dir .ci/expo-quickjs/build --output-on-failure
      - name: Harden the pinned host test transport shutdown race
        run: |
          cp "$GITHUB_WORKSPACE/scripts/fixtures/native-transport.ts" tests/native-transport.ts
          node --test "$GITHUB_WORKSPACE/scripts/fixtures/native-transport.test.mjs"
        working-directory: .ci/expo-quickjs
      - run: npm test
        working-directory: .ci/expo-quickjs
      - run: node --test scripts/check-publish-state.test.mjs
      - run: npm run test:release
      - run: npm test
      - run: npm run typecheck
      - name: Pack native peer
        run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: .ci/expo-quickjs
      - name: Check clean packed consumer and rerun native/SQLite tests
        run: node scripts/check-package.mjs "$RUNNER_TEMP/expo-quickjs-0.1.0.tgz"
      - name: Upload verified npm package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: pi-codemode-expo-*.tgz
          if-no-files-found: error
