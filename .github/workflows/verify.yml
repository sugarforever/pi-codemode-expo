name: Verify adapter package
on: [push, pull_request, workflow_dispatch]
jobs:
  protocol-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:protocol
      - run: npm run typecheck
      - run: npm run build
      - run: npm pack
# Full native/SQLite tests additionally require a built expo-quickjs channel_runner.
# See README; no nonexistent remote repository or binary download is assumed here.
